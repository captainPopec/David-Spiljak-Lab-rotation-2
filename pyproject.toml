[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wsi"
version = "0.0.1"
description = "WSI + cellina: new methods for whole-slide-image-informed spatial perturbation modeling."
readme = "src/wsi/README.md"
requires-python = ">=3.10"
# Runtime deps for the heavy stacks (cellina, cpa/pertpy, spatialdata, lazyslide) are
# provided by the conda environments under envs/, NOT pinned here. `pip install -e .`
# only needs to expose the `wsi` package so the student can import their own code.
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "anndata",
    "scanpy",
]

[tool.setuptools.packages.find]
where = ["src"]
